<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17" />
      <stop offset="50%" stop-color="#121a2d" />
      <stop offset="100%" stop-color="#07111e" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#4facfe" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="purple-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7f00ff" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#e100ff" stop-opacity="0.3" />
    </linearGradient>

    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.8" />
    </linearGradient>

    <!-- Filters -->
    <filter id="blur-bg" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="40" />
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .title-text {
      font-family: 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif;
      font-weight: 800;
      font-size: 46px;
      fill: #ffffff;
      letter-spacing: -0.5px;
    }
    .subtitle-text {
      font-family: 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif;
      font-weight: 400;
      font-size: 18px;
      fill: #94a3b8;
    }
    .badge-text {
      font-family: 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #38bdf8;
    }
    
    /* Dynamic Animations */
    @keyframes pulse-grid {
      0%, 100% { opacity: 0.15; transform: scale(1); }
      50% { opacity: 0.35; transform: scale(1.02); }
    }
    @keyframes scan-line {
      0% { transform: translateY(-100px); opacity: 0; }
      50% { opacity: 0.6; }
      100% { transform: translateY(400px); opacity: 0; }
    }
    @keyframes float-particle {
      0%, 100% { transform: translateY(0px) translateX(0px); }
      50% { transform: translateY(-15px) translateX(10px); }
    }
    @keyframes rotate-ring {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .grid-bg {
      animation: pulse-grid 8s ease-in-out infinite;
      transform-origin: center;
    }
    .scanner {
      animation: scan-line 6s linear infinite;
    }
    .p1 { animation: float-particle 4s ease-in-out infinite; }
    .p2 { animation: float-particle 6s ease-in-out infinite 1s; }
    .p3 { animation: float-particle 5s ease-in-out infinite 2s; }
    .rotating-hub {
      animation: rotate-ring 25s linear infinite;
      transform-origin: 1020px 200px;
    }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="400" rx="16" fill="url(#bg-grad)" />

  <!-- Ambient Light Orbs -->
  <circle cx="150" cy="100" r="180" fill="#00f2fe" opacity="0.15" filter="url(#blur-bg)" />
  <circle cx="1000" cy="300" r="220" fill="#7f00ff" opacity="0.2" filter="url(#blur-bg)" />
  <circle cx="600" cy="200" r="150" fill="#3b82f6" opacity="0.1" filter="url(#blur-bg)" />

  <!-- Dynamic Isometric City Grid Background -->
  <g class="grid-bg" stroke="#38bdf8" stroke-width="0.75" opacity="0.2">
    <!-- Grid Lines -->
    <line x1="0" y1="100" x2="1200" y2="100" />
    <line x1="0" y1="200" x2="1200" y2="200" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="200" y1="0" x2="200" y2="400" />
    <line x1="400" y1="0" x2="400" y2="400" />
    <line x1="600" y1="0" x2="600" y2="400" />
    <line x1="800" y1="0" x2="800" y2="400" />
    <line x1="1000" y1="0" x2="1000" y2="400" />

    <!-- Isometric building wireframes in background -->
    <polygon points="850,280 920,240 990,280 920,320" fill="none" stroke="#00f2fe" stroke-width="1" />
    <polygon points="850,280 850,200 920,160 920,240" fill="none" stroke="#00f2fe" stroke-width="1" />
    <polygon points="920,240 920,160 990,200 990,280" fill="none" stroke="#00f2fe" stroke-width="1" />

    <polygon points="960,220 1020,185 1080,220 1020,255" fill="none" stroke="#8b5cf6" stroke-width="1" />
    <polygon points="960,220 960,130 1020,95 1020,185" fill="none" stroke="#8b5cf6" stroke-width="1" />
    <polygon points="1020,185 1020,95 1080,130 1080,220" fill="none" stroke="#8b5cf6" stroke-width="1" />
  </g>

  <!-- Dynamic Scanner Line -->
  <line class="scanner" x1="0" y1="0" x2="1200" y2="0" stroke="url(#cyan-glow)" stroke-width="3" filter="url(#glow)" />

  <!-- Interactive/Dynamic Nodes & Floating Data Elements (Background / Right Side) -->
  <g class="rotating-hub" opacity="0.4">
    <circle cx="1020" cy="200" r="90" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="8 6" />
    <circle cx="1020" cy="200" r="130" fill="none" stroke="#8b5cf6" stroke-width="1" stroke-dasharray="4 12" />
  </g>

  <g class="p1">
    <circle cx="880" cy="140" r="5" fill="#00f2fe" filter="url(#glow)" />
    <circle cx="1100" cy="260" r="4" fill="#38bdf8" filter="url(#glow)" />
  </g>
  <g class="p2">
    <circle cx="950" cy="90" r="6" fill="#a855f7" filter="url(#glow)" />
    <circle cx="820" cy="220" r="4" fill="#ec4899" filter="url(#glow)" />
  </g>
  <g class="p3">
    <circle cx="1050" cy="130" r="4.5" fill="#3b82f6" filter="url(#glow)" />
  </g>

  <!-- FOREGROUND CONTAINER CARD (Guarantees Title Visibility & High Contrast) -->
  <rect x="50" y="55" width="740" height="290" rx="14" fill="url(#card-grad)" stroke="#334155" stroke-width="1.5" />

  <!-- Pill Badge -->
  <rect x="80" y="85" width="220" height="30" rx="15" fill="#0f172a" stroke="#0284c7" stroke-width="1.2" />
  <circle cx="98" cy="100" r="5" fill="#00f2fe" filter="url(#glow)" />
  <text x="112" y="105" class="badge-text">URBAN DIGITAL TWINS</text>

  <!-- Main Title -->
  <text x="80" y="175" class="title-text" filter="url(#glow)">Awesome Digital Twin</text>
  <text x="80" y="225" class="title-text" fill="#38bdf8">For Smart Cities 🏙️⚡</text>

  <!-- Subtitle -->
  <text x="80" y="272" class="subtitle-text">Curated SaaS Platforms, Open-Source Stacks, 3D Geospatial</text>
  <text x="80" y="298" class="subtitle-text">Engines, Real-Time Sensor Fusion &amp; Urban Simulations.</text>
</svg>
